<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cybrdelic — 02 / Elements</title>
<style>:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#000;color:#d9d5cc}*{box-sizing:border-box}body{margin:0;background:#000}main{max-width:1440px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:22px;font-size:11px;letter-spacing:.15em}header a{color:#777;text-decoration:none;letter-spacing:0}.elements{display:flex;gap:8px;flex-wrap:wrap}.elements button{min-width:82px;border-color:transparent;color:#777;padding:10px 15px}.elements button[aria-pressed=true]{color:#e8e2d8;border-color:#555148}.stage{aspect-ratio:16/9;background:#000}video{width:100%;height:100%;display:block;background:#000}nav.controls{display:flex;gap:18px;align-items:center;justify-content:space-between;border-top:1px solid #242424;padding-top:18px;font-size:12px}.controls a{color:inherit;text-decoration:none;padding:8px 12px;border:1px solid #393630}button{font:inherit;color:inherit;background:#000;border:1px solid #393630;padding:8px 12px;cursor:pointer}button:hover,.controls a:hover{border-color:#a8a298}a:focus-visible,button:focus-visible{outline:2px solid #e4ad74;outline-offset:4px}.meta{color:#777;margin-left:auto}figure{margin:28px 0 0}figure[hidden]{display:none}figure img{display:block;width:100%;background:#000}figcaption{color:#888;font-size:12px;padding-bottom:4px}@media(max-width:600px){main{padding:16px 10px}nav.controls{flex-wrap:wrap;gap:10px}.meta{width:100%;order:3;margin-left:0}.elements{gap:2px}.elements button{min-width:0;padding:10px 12px}}</style></head>
<body><main><header><span>CYBRDELIC / 02</span><a href="../../">All bending videos ↗</a></header>
<nav class="elements" aria-label="Choose element"><button data-element="fire" aria-pressed="true">Fire</button><button data-element="water" aria-pressed="false">Water</button><button data-element="earth" aria-pressed="false">Earth</button><button data-element="air" aria-pressed="false">Air</button><button data-element="ice" aria-pressed="false">Ice</button><button data-element="lava" aria-pressed="false">Lava</button><button data-element="lightning" aria-pressed="false">Lightning</button><button data-element="telekinesis" aria-pressed="false">Telekinesis</button></nav>
<div class="stage"><video id="film" controls autoplay muted loop playsinline preload="metadata" poster="poster.jpg" src="fire-02.mp4" aria-label="Cybrdelic sigil 02 formed in fire"></video></div>
<nav class="controls"><button id="reference" aria-expanded="false" aria-controls="artwork">Compare 02 artwork</button><button id="previous" aria-pressed="false" hidden>Previous version</button><span class="meta">1920 × 1080 · 30 fps · 9.8 seconds</span><a id="download" href="fire-02.mp4" download="cybrdelic-02-fire.mp4">Download fire ↓</a></nav>
<figure id="artwork" hidden><figcaption>Approved 02 artwork.</figcaption><img src="artwork-02.png" alt="The original broad, pointed Cybrdelic 02 sigil with its cutouts"></figure>
</main><script>
const film=document.getElementById('film'),reference=document.getElementById('reference'),art=document.getElementById('artwork'),download=document.getElementById('download'),buttons=[...document.querySelectorAll('[data-element]')];
const revised=new Set(['water','earth','lightning','telekinesis']),previous=document.getElementById('previous');let active='fire',showPrevious=false;
const revisions={water:8,earth:6,lightning:5,telekinesis:4};
function movieFor(name,prior=false){return revisions[name]?`${name}-02-r${revisions[name]-(prior?1:0)}.mp4`:`${name}-02.mp4`;}
function posterFor(name,prior=false){return name==='fire'?'poster.jpg':revisions[name]?`${name}-r${revisions[name]-(prior?1:0)}-poster.jpg`:`${name}-poster.jpg`;}
function select(name,push=true){if(!buttons.some(b=>b.dataset.element===name))name='fire';film.pause();active=name;showPrevious=false;previous.hidden=!revised.has(name);previous.setAttribute('aria-pressed','false');previous.textContent='Previous version';film.poster=posterFor(name);film.src=movieFor(name);film.setAttribute('aria-label',`Cybrdelic sigil 02 formed in ${name}`);buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.element===name)));download.hidden=false;download.href=film.src;download.download=`cybrdelic-02-${name}.mp4`;download.textContent=`Download ${name} ↓`;document.title=`Cybrdelic — 02 / ${name[0].toUpperCase()+name.slice(1)}`;art.hidden=true;reference.setAttribute('aria-expanded','false');reference.textContent='Compare 02 artwork';if(push){const url=new URL(location.href);url.searchParams.set('element',name);history.replaceState(null,'',url)}film.load();film.play().catch(()=>{});}
previous.addEventListener('click',()=>{showPrevious=!showPrevious;film.pause();art.hidden=true;reference.setAttribute('aria-expanded','false');reference.textContent='Compare 02 artwork';film.poster=posterFor(active,showPrevious);film.src=movieFor(active,showPrevious);download.href=film.src;download.download=`cybrdelic-02-${active}${showPrevious?'-previous':'-revised'}.mp4`;previous.setAttribute('aria-pressed',String(showPrevious));previous.textContent=showPrevious?'Return to revision':'Previous version';film.load();film.play().catch(()=>{});});
film.addEventListener('loadedmetadata',()=>{document.querySelector('.meta').textContent=`${film.videoWidth} × ${film.videoHeight} · 30 fps · ${film.duration.toFixed(1)} seconds`});
buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.element)));select(new URL(location.href).searchParams.get('element')||'fire',false);
reference.addEventListener('click',()=>{art.hidden=!art.hidden;reference.setAttribute('aria-expanded',String(!art.hidden));reference.textContent=art.hidden?'Compare 02 artwork':'Hide artwork';if(!art.hidden){film.pause();art.scrollIntoView({behavior:'smooth',block:'nearest'})}});
</script></body></html>
